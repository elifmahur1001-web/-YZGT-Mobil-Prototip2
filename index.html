<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Vision</title>
    <!-- Telefonlarla %100 Uyumlu Kararlı Tailwind CSS Sürümü -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Kararlı TensorFlow ve COCO-SSD Kütüphaneleri -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        .video-container { position: relative; width: 100%; max-width: 480px; margin: 0 auto; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; width: 100%; height: 100%; pointer-events: none; }
        video { width: 100%; height: auto; display: block; border-radius: 12px; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col items-center p-4">

    <header class="text-center my-4">
        <h1 class="text-2xl font-bold text-blue-400">AI SMART VISION</h1>
        <p class="text-xs text-gray-400 mt-1">Mobil Uyumlu Güvenlik Sistemi</p>
    </header>

    <main class="w-full max-w-sm bg-gray-800 rounded-2xl p-4 shadow-xl border border-gray-700">
        
        <div class="grid grid-cols-2 gap-3 mb-4 text-xs">
            <div class="bg-gray-850 p-3 rounded-xl border border-gray-700 bg-gray-900">
                <span class="text-gray-400 font-bold block mb-1">🎙️ SESLİ KOMUT:</span>
                <p id="speech-status" class="text-yellow-400 font-medium">Bekleniyor...</p>
            </div>
            <div class="bg-gray-850 p-3 rounded-xl border border-gray-700 bg-gray-900">
                <span class="text-gray-400 font-bold block mb-1">🤖 AI MODELİ:</span>
                <p id="model-status" class="text-red-400 font-medium">Yükleniyor...</p>
            </div>
        </div>

        <div class="flex justify-center items-center bg-gray-950 rounded-xl overflow-hidden p-1 bg-black">
            <div class="video-container">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="flex justify-center gap-4 mt-4">
            <button id="btn-start" class="bg-green-600 disabled:opacity-50 text-white px-6 py-2 rounded-lg font-bold text-sm shadow" disabled>Sistemi Başlat</button>
            <button id="btn-stop" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold text-sm shadow">Kapat</button>
        </div>

        <div class="mt-3 text-center text-[11px] text-gray-500">
            Komutlar: "aç" veya "kapat" demeniz yeterlidir.
        </div>
    </main>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const modelStatus = document.getElementById('model-status');
        const speechStatus = document.getElementById('speech-status');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');

        let model = null;
        let stream = null;
        let isDetecting = false;

        async function loadModel() {
            try {
                model = await cocoSsd.load();
                modelStatus.innerText = "Hazır! ✅";
                modelStatus.className = "text-green-400 font-medium";
                btnStart.disabled = false;
            } catch (e) {
                modelStatus.innerText = "Hata Oluştu!";
            }
        }

        async function startCamera() {
            if (!model) return;
            if (stream) stopCamera();
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                video.srcObject = stream;
                isDetecting = true;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    detectObjects();
                };
            } catch (err) {
                alert("Kamera izni verilmedi veya link güvenli (HTTPS) değil!");
            }
        }

        function stopCamera() {
            isDetecting = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        async function detectObjects() {
            if (!isDetecting || video.readyState < 2) {
                if (isDetecting) requestAnimationFrame(detectObjects);
                return;
            }

            const predictions = await model.detect(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            predictions.forEach(p => {
                const [x, y, w, h] = p.bbox;
                const cls = p.class;
                const score = (p.score * 100).toFixed(0);

                let col = '#3b82f6';
                if (cls === 'person') col = '#ef4444';
                else if (['car', 'truck', 'bus', 'motorcycle'].includes(cls)) col = '#eab308';
                else if (['cat', 'dog', 'bird'].includes(cls)) col = '#10b981';

                ctx.strokeStyle = col;
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, w, h);

                ctx.fillStyle = col;
                ctx.fillRect(x, y - 22, 100, 22);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(`${cls.toUpperCase()} %${score}`, x + 5, y - 6);
            });

            if (isDetecting) requestAnimationFrame(detectObjects);
        }

        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                speechStatus.innerText = "Destek yok ❌";
                return;
            }

            const rec = new SR();
            rec.continuous = true;
            rec.lang = 'tr-TR';

            rec.onstart = () => {
                speechStatus.innerText = "Dinleniyor... 🎧";
                speechStatus.className = "text-green-400 font-medium";
            };

            rec.onresult = (e) => {
                const cmd = e.results[e.resultIndex][0].transcript.toLowerCase();
                if (cmd.includes('aç') || cmd.includes('başlat')) startCamera();
                if (cmd.includes('kapat') || cmd.includes('durdur')) stopCamera();
            };

            rec.onend = () => { if(isDetecting) rec.start(); };
            rec.start();
        }

        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        loadModel();
        initSpeech();
    </script>
</body>
</html>
